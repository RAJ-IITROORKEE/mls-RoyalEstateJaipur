name: Quality checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      RATE_LIMIT_BACKEND: memory
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma:validate
      - name: Validate migrations in disposable Postgres
        run: npm run prisma:deploy
      - name: Seed synthetic CI fixtures
        run: npx tsx scripts/seed-ci.ts --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Essential public and request-boundary browser checks
        run: npm run test:e2e -- e2e/public.spec.ts e2e/api-security.spec.ts --reporter=list
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
